<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Smart Library System</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>Student Login</h1>
      <p class="subtitle">Enter your library ID and password to access your account.</p>

      <div id="loginMessage" class="form-message" style="display:none;"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="libraryId">Library ID</label>
          <input type="text" id="libraryId" name="libraryId" placeholder="e.g. LIB-2024-001" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">Login</button>
      </form>

      <p class="subtitle" style="margin-top:1.5rem;">
        New to the library? <a href="/register.html">Create an account</a>
      </p>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    const loginForm = document.getElementById('loginForm');
    const loginMessage = document.getElementById('loginMessage');

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      const libraryId = document.getElementById('libraryId').value.trim();
      const password = document.getElementById('password').value;

      if (!libraryId || !password) {
        Auth.showFormMessage('loginMessage', 'Please fill in all fields', 'error');
        return;
      }

      const submitBtn = loginForm.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ libraryId, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Login failed');
        }

        Auth.setToken(data.token);
        window.location.href = '/dashboard.html';
      } catch (error) {
        Auth.showFormMessage('loginMessage', error.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
