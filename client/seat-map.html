<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seat Map - Smart Library System</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="seat-container">
    <div class="seat-header">
      <h1>📍 Live Seat Map</h1>
      <div class="nav-links">
        <a href="/dashboard.html" class="btn btn-secondary">Back</a>
        <a href="/scan.html" class="btn btn-secondary">Scan Entry</a>
      </div>
    </div>

    <div class="seat-grid" id="seatGrid" aria-label="Seat selection grid"></div>

    <div class="legend" aria-hidden="true">
      <div class="legend-item"><span class="legend-dot" style="background:#27ae60"></span> Available</div>
      <div class="legend-item"><span class="legend-dot" style="background:#f39c12"></span> Held (booked)</div>
      <div class="legend-item"><span class="legend-dot" style="background:#e74c3c"></span> Occupied</div>
      <div class="legend-item"><span class="legend-dot" style="background:#95a5a6"></span> Maintenance</div>
    </div>
  </div>

  <div class="booking-modal" id="bookingModal" role="dialog" aria-label="Confirm booking">
    <div class="modal-content">
      <h2>Confirm Booking</h2>
      <p id="modalSeatLabel"></p>
      <div class="countdown" id="countdown" aria-live="polite">15:00</div>
      <p style="color:#7f8c8d;font-size:0.9rem;">Booked seats expire after <span id="holdMinutes">15</span> minutes</p>
      <div class="btn-row">
        <button class="btn btn-primary" id="confirmBookBtn">Confirm</button>
        <button class="btn btn-secondary" id="cancelBookBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/socket.js"></script>
  <script src="/js/toasts.js"></script>
  <script>
    let pendingSeatId = null;
    let countdownInterval = null;
    let countdownSeconds = 15 * 60;

    (async () => {
      if (!Auth.isLoggedIn()) { window.location.href = '/login.html'; return; }
      await renderSeats();
      startSocket();
    })();

    async function renderSeats() {
      try {
        const res = await Auth.authFetch('/api/seats');
        if (!res) return;
        const data = await res.json();
        renderSeatData(data.seats);
      } catch (e) { console.error(e); }
    }

    function renderSeatData(seats) {
      const grid = document.getElementById('seatGrid');
      const icons = { available: '🟢', held: '🟡', occupied: '🔴', maintenance: '⚫' };
      const labels = { available: 'Available', held: 'Held', occupied: 'Occupied', maintenance: 'Maintenance' };
      grid.innerHTML = seats.map(s =>
        `<button type="button" class="seat ${s.status}" data-id="${s.id}" data-label="${s.seat_label}" aria-label="Seat ${s.seat_label}, ${labels[s.status]}" ${s.status === 'available' ? '' : 'disabled'}>
          <span class="seat-icon">${icons[s.status]}</span>
          <span>${s.seat_label}</span>
          <small>${labels[s.status]}</small>
        </button>`
      ).join('');

      grid.querySelectorAll('.seat.available').forEach(btn => {
        btn.addEventListener('click', () => openBooking(Number(btn.dataset.id), btn.dataset.label));
      });
    }

    Socket.onSeatUpdate(renderSeats);

    function openBooking(seatId, label) {
      pendingSeatId = seatId;
      document.getElementById('modalSeatLabel').textContent = `Seat ${label} (${seatId})`;
      document.getElementById('bookingModal').classList.add('active');
      startCountdown();
    }

    document.getElementById('confirmBookBtn').addEventListener('click', async () => {
      const res = await Auth.authFetch(`/api/seats/${pendingSeatId}/book`, { method: 'POST' });
      if (!res) return;
      if (!res.ok) {
        const data = await res.json();
        Toast.showToast(data.error || 'Booking failed', 'error');
        return;
      }
      document.getElementById('bookingModal').classList.remove('active');
      Toast.showToast('Seat booked successfully', 'success');
      renderSeats();
    });

    document.getElementById('cancelBookBtn').addEventListener('click', () => {
      document.getElementById('bookingModal').classList.remove('active');
      stopCountdown();
    });

    function startCountdown() {
      countdownSeconds = 15 * 60;
      stopCountdown();
      const el = document.getElementById('countdown');
      const minsEl = document.getElementById('holdMinutes');
      const holdMinutes = Number(minsEl.textContent) || 15;

      countdownInterval = setInterval(() => {
        countdownSeconds--;
        const m = Math.floor(countdownSeconds / 60).toString().padStart(2, '0');
        const s = (countdownSeconds % 60).toString().padStart(2, '0');
        if (el) el.textContent = `${m}:${s}`;
        if (countdownSeconds <= 0) stopCountdown();
      }, 1000);
    }

    function stopCountdown() {
      if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
    }
  </script>
</body>
</html>
